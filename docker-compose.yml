services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    # GPU: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_NAME: ${WEBUI_NAME:-Qwen Chat}
      DEFAULT_USER_ROLE: ${DEFAULT_USER_ROLE:-pending}
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-true}
      WEBUI_AUTH: ${WEBUI_AUTH:-true}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - open-webui:/app/backend/data

  # Optional MCP-to-HTTP proxy for stdio MCP servers.
  # Start with: docker compose --profile mcp up -d
  mcpo:
    image: ghcr.io/open-webui/mcpo:main
    container_name: mcpo
    restart: unless-stopped
    profiles: ["mcp"]
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MCPO_API_KEY: ${MCPO_API_KEY:-change-me-mcpo-key}
    command:
      - "--api-key"
      - "${MCPO_API_KEY:-change-me-mcpo-key}"
      - "--"
      - "npx"
      - "-y"
      - "@modelcontextprotocol/server-time"

volumes:
  ollama:
  open-webui:
